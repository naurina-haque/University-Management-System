services:
  db:
    image: mysql:8.0
    container_name: ums-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ums_db
    ports:
      - "3307:3306"
    volumes:
      - ums-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ums-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/ums_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASS: root
      JWT_SECRET: put-a-long-random-secret-key-here-min-32-chars
    ports:
      - "8080:8080"

volumes:
  ums-data: