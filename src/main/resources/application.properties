spring.application.name=university

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ums_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always
app.jwt.secret=${JWT_SECRET:change-this-to-a-very-long-random-secret-key-min-32-chars}
app.jwt.expiration-ms=3600000